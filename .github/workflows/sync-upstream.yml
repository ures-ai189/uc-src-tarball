name: Sync with Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest upstream release
        id: upstream
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getLatestRelease({
              owner: 'ungoogled-software',
              repo: 'ungoogled-chromium'
            });
            core.setOutput('LATEST_TAG', data.tag_name);
            core.info('Upstream latest: ' + data.tag_name);

      - name: Check if already built
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.upstream.outputs.LATEST_TAG }}';
            if (!tag) {
              core.setOutput('HAS_UPDATE', 'false');
              core.info('No upstream tag found, skipping.');
              return;
            }
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              core.info('Version ' + tag + ' already built, skipping.');
              core.setOutput('HAS_UPDATE', 'false');
            } catch (e) {
              if (e.status === 404) {
                core.info('New version ' + tag + ' detected!');
                core.setOutput('HAS_UPDATE', 'true');
              } else {
                throw e;
              }
            }

      - name: Trigger build workflow
        if: steps.check.outputs.HAS_UPDATE == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.upstream.outputs.LATEST_TAG }}';
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-tarball.yml',
              ref: 'main',
              inputs: { upstream_tag: tag }
            });
            core.info('Build triggered for ' + tag);
